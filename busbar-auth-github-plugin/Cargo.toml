# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-github-plugin"
version = "1.0.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "The GitHub-OAuth login module as a droppable busbar plugin — a cdylib exporting the auth C ABI (login-capable, auth ABI v2). Drop it in the plugins folder and add `github` to auth.chain with a browser_login block (the CORE injects client_secret)."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]   # cdylib for the C ABI delivery; rlib so the unit tests can exercise it as a normal crate too

[dependencies]
# busbar-auth-github is a SAME-REPO sibling crate (this plugin brings 100% of what it needs — the real
# logic lives here, not in busbarAI). Only busbar-api/busbar-plugin-sdk still reach into busbarAI —
# INTERIM local path dependencies into a sibling checkout, since busbarAI isn't public yet; once it
# ships publicly these become git (pinned rev/tag) or crates.io dependencies instead.
busbar-api = { path = "../../busbarAI/crates/api" }
busbar-plugin-sdk = { path = "../../busbarAI/crates/plugin-sdk" }
busbar-auth-github = { path = "../busbar-auth-github" }
serde_json = "1"
