# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-github-plugin"
version = "1.0.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "The GitHub-OAuth login module as a droppable busbar plugin — a cdylib exporting the auth kind's door (login-capable, auth ABI v3). Drop it in the plugins folder and add `github` to auth.chain with a browser_login block; the plugin holds its client secret and runs the token exchange over its own need."
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]   # cdylib: the dropped-in image exporting the door; rlib: the tests link it

[features]
# THE DROPPED-IN DOOR: `export_door!` emits the one C symbol `busbar_plugin_door`, and ONLY the
# dropped-in cdylib may export it (compiled in = dropped in, one table: a busbar build that links
# this crate as a row, alone or beside others, must carry no door symbol, or two doors in one
# binary multiply define it under `lto = "fat"`). OFF by default; the dropped-in artifact is built
# `cargo build --release -p busbar-auth-github-plugin --features dropped-in`, and `cargo test` names this crate
# below with it on so the cdylib the conformance test opens carries the door.
dropped-in = []

[dependencies]
# busbar-auth-github is a SAME-REPO sibling crate (this plugin brings 100% of what it needs — the real
# logic lives here, not in busbar). The one busbar crate is busbar-contract (#40), whose
# `abi::sdk` carries the export macro — pinned by git rev to `.busbar-ref` field 1.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "934a016e20fc1a67c209b671d137c8cc28092767" }
busbar-auth-github = { path = "../busbar-auth-github" }

[dev-dependencies]
# The conformance test opens this crate's own cdylib WITH its dropped-in door on (see `[features]`).
busbar-auth-github-plugin = { path = ".", features = ["dropped-in"] }
# Dev-only: the linked + dropped-in conformance test (tests/conformance.rs) signs, packs, scans and
# opens the built cdylib over the REAL loader, and the live plugin-side e2e (tests/e2e.rs) locates it
# with the loader's filename helper. Same pinned rev as busbar-contract, so one busbar source resolves.
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "934a016e20fc1a67c209b671d137c8cc28092767" }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
serde_json = "1"
