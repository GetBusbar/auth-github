# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-github-plugin"
version = "1.0.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "The GitHub-OAuth login module as a droppable busbar plugin — a cdylib exporting the auth C ABI (login-capable, auth ABI v2). Drop it in the plugins folder and add `github` to auth.chain with a browser_login block (the CORE injects client_secret)."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]   # cdylib for the C ABI delivery; rlib so the unit tests can exercise it as a normal crate too

[dependencies]
# busbar-auth-github is a SAME-REPO sibling crate (this plugin brings 100% of what it needs — the real
# logic lives here, not in busbar). The one busbar crate is busbar-contract (#40), whose
# `abi::sdk` carries the export macro — pinned by git rev to `.busbar-ref` field 1.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "7a5b429041752e00375e120ab1547a8928c3dee4" }
busbar-auth-github = { path = "../busbar-auth-github" }
serde_json = "1"

[dev-dependencies]
# Dev-only: the linked + dropped-in conformance test (tests/conformance.rs) signs, packs, scans and
# opens the built cdylib over the REAL loader, and the live plugin-side e2e (tests/e2e.rs) locates it
# with the loader's filename helper. Same pinned rev as busbar-contract, so one busbar source resolves.
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "7a5b429041752e00375e120ab1547a8928c3dee4" }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
