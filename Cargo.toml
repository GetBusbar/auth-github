# SPDX-License-Identifier: Apache-2.0
#
# This repo brings 100% of what it needs: the real GitHub-OAuth login logic (busbar-auth-github) and
# the thin dlopen ABI adapter that packages it as a busbar plugin (busbar-auth-github-plugin) both
# live here, as a same-repo Cargo workspace — not split across this repo and busbar.
#
# Its one busbar dependency is busbar-contract (#40: a plugin names the contract only; the plugin
# SDK is `busbar_contract::abi::sdk` since the #84 merge), plus busbar-plugin-loader dev-only for the
# linked + dropped-in conformance test — both `git` dependencies on GetBusbar/busbar pinned to the
# rev in `.busbar-ref` field 1. No sibling-checkout path dependency ships in any manifest.
[workspace]
resolver = "2"
members = [
    "busbar-auth-github",
    "busbar-auth-github-plugin",
]
