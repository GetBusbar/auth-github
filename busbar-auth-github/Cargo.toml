# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-github"
version = "1.0.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The GitHub-OAuth login module for busbar: drive GitHub's authorization-code → opaque-access-token → REST /user → /user/orgs flow over the busbar multi-hop LoginModule ABI (1.5.2, auth ABI v2) and map it to a Principal (github:<login> + github:org/<org> groups). Login-capable: implements busbar_contract::auth::LoginModule. The confidential-client secret is injected by the CORE, never held here."
license = "Apache-2.0"

[dependencies]
# The ONE busbar crate a plugin names (#40: contract only). Pinned by git rev to the busbar commit in
# `.busbar-ref`; a busbar build that links this crate `[patch]`es the busbar git source to its own
# tree, so ONE copy of the contract links.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "8b7b6473f47f8d37ae60839c74cfe6a9b64a1dc9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
